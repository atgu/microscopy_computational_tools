hail-batch:
    billing-project: 
    regions:
        - us-central1
    remote-tmpdir: gs://

channel_mapping:
    # used by the Hail Batch script
    # the following example is for LipocyteProfiler
    DNA:  HOECHST 33342
    AGP:  Alexa 568
    RNA:  Alexa 488 long
    ER:   Alexa 488
    Mito: MitoTracker Deep Red

cellpose:
    machine-type: n1-standard-4+nvidia-tesla-t4+1
    num-processes: 4
    # although not mandatory, if you run cellpose, it is recommended to copy the following files
    # to a private bucket and provide the gs:// URI to this configuration file
    # https://www.cellpose.org/models/nucleitorch_0
    # https://www.cellpose.org/models/size_nucleitorch_0.npy
    model-weights: null
    model-size: null

unidino:
    machine-type: n1-standard-4+nvidia-tesla-t4+1
    num-processes: 4
    model-weights: gs:/.../uniDINO.pth # from https://zenodo.org/records/14988837

cpcnn:
    machine-type: n1-standard-4+nvidia-tesla-t4+1
    num-workers: 2
    model-weights: gs://.../Cell_Painting_CNN_v1.hdf5 # from https://zenodo.org/records/7114558

dino4cells:
    machine-type: n1-standard-4+nvidia-tesla-t4+1
    num-workers: 2
    model-weights: gs://.../DINO_cell_painting_base_checkpoint.pth # from https://zenodo.org/records/8061392